version: 0.8.0
tutorial: false

countries: ["TW"]

enable:
  retrieve_databundle: true
  retrieve_databundle_sector: true
  retrieve_cutout: false
  build_cutout: false
  build_natura_raster: true
  progress_bar: true

run:
  name: "tw_test1_gurobi_2013_7d_4h_6b"
  sector_name: "tw_test1_gurobi_2013_7d_4h_6b"

scenario:
  clusters: [6]
  opts: [Co2L-4H]
  # Keep today's transmission grid fixed. The default "copt" makes lines
  # extendable (see scripts/prepare_network.py set_transmission_limit).
  ll: ["v1.0"]

snapshots:
  start: "2013-03-01"
  end: "2013-03-08"

clean_osm_data_options:
  threshold_voltage: 35000

base_network:
  min_voltage_substation_offshore: 35000
  min_voltage_rebase_voltage: 35000

cluster_options:
  simplify_network:
    # Keep isolated subnetworks separate from each other, then fetch small
    # isolated subnetworks into the nearest backbone network instead of leaving
    # merged isolated representatives such as TW1 0 and TW2 0.
    p_threshold_merge_isolated: false
    s_threshold_fetch_isolated: 0.05

electricity:
  co2limit: .inf
  co2base: 1.2e+8 # unit: kgCO2-eq, year 2025
  automatic_emission: false
  # Official Taiwan fleet built by pypsa_tw/data/build_custom_powerplants.py
  # (sources: pypsa_tw/data/README.md). Use only that file, keep plants built up
  # to 2026 (new Taichung gas units), and do not top solar/wind up to IRENA 2023.
  custom_powerplants: replace
  powerplants_filter: (DateOut >= 2026 or DateOut != DateOut) and (DateIn <= 2026 or DateIn != DateIn)
  estimate_renewable_capacities:
    stats: false
  # Test 1 represents today's fixed system, so no candidate technologies are investable.
  extendable_carriers:
    Generator: []
    StorageUnit: []
    Store: []
    Link: []

load_options:
  # GEGIS demand is only available as a projection (2030 onwards). The fleet is
  # Taipower's system (data/custom_powerplants.csv), so scale the 2030 profile to
  # Taipower-system generation in 2024: 251.44 / 335.7 TWh = 0.749. The national
  # total (288.6 TWh) also covers industrial self-generation not in the fleet.
  scale: 0.749

atlite:
  default: cutout-2013-era5-tw
  cutouts:
    # Full 2013 weather year, shared by all Taiwan runs. The time range is
    # set explicitly so it does not depend on each run's snapshots.
    cutout-2013-era5-tw:
      module: era5
      dx: 0.3
      dy: 0.3
      time: ["2013-01-01", "2013-12-31"]

renewable:
  hydro:
    # --- change this to 6 based on ChatGPT's comment:
    # Taiwan has steep terrain, short rivers and strong spatial variation in rainfall.
    # Level 4 may aggregate hydrologically distinct catchments too heavily.
    hydrobasins_level: 6
    hydro_max_hours: "energy_capacity_totals_by_country"

solving:
  options:
    load_shedding: false
  solver:
    name: gurobi
    options: gurobi-default
