# Scenario overlay: the planned system in 2034, under 2013 weather.
# Use on top of the Test 2 config:
#   snakemake -j 1 solve_all_networks --configfile pypsa_tw/config/config_tw_test2_highs.yaml pypsa_tw/config/scenarios/future_2034.yaml
# Fleet: data/custom_powerplants_tw2034.csv from pypsa_tw/data/build_future_powerplants.py
# (MOEA supply-demand report 2025 edition: thermal schedule of Figure 3-3,
# renewable targets of Table 3-1). The grid stays as today, nothing is
# investable, and load shedding is allowed, so any shortfall shows up as
# unserved energy.

run:
  name: "tw_future2034_highs_w2013_4h_6b_ls"
  sector_name: "tw_future2034_highs_w2013_4h_6b_ls"

electricity:
  custom_powerplants_file: data/custom_powerplants_tw2034.csv
  powerplants_filter: (DateOut >= 2034 or DateOut != DateOut) and (DateIn <= 2034 or DateIn != DateIn)

load_options:
  # The report's +1.7%/yr (2025-2034) applied to 251.44 TWh in 2024:
  # 251.44 x 1.017^10 = 297.6 TWh, i.e. scale 297.6 / 335.7 = 0.8865.
  scale: 0.8865

costs:
  # technology-data publishes every 5 years; 2035 is the nearest to 2034.
  year: 2035

solving:
  options:
    load_shedding: true

existing_capacities:
  # Plants are grouped by commissioning year into these bins; the default ends at
  # 2030, and units commissioned 2031-2034 need a 2035 bin.
  grouping_years_power: [1960, 1965, 1970, 1975, 1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2020, 2025, 2030, 2035]
